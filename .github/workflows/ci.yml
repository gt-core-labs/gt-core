# gt-core CI (hq-test-regress.3).
#
# Two jobs:
#   build-test — HARD gate. `cargo build` + `cargo test` over the workspace. The
#                workspace test run also exercises the event-replay determinism
#                checks in gt-events (docs/03 Rule 7), so the byte-for-byte gate
#                is covered here without a bespoke command. fmt + clippy run as
#                REPORT-ONLY (continue-on-error) because `main` still carries
#                rustfmt + clippy debt and CLAUDE.md forbids a blanket
#                `cargo fmt` (it collides with live worktrees + an advancing
#                main). Flip these to hard gates once the debt is cleared.
#   contract   — HARD gate. Boots the same engines the gated contract suites
#                need (Dolt + Postgres) as services and runs the suites that
#                otherwise SKIP for lack of GT_DOLT_URL / GT_PG_URL — i.e. today
#                they run nowhere. This is the headline win of wiring CI.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # System deps for the OCR path (hq-docs-store.4, docs/11): tesseract + leptonica
      # back the swappable `OcrEngine` tesseract impl; clang/pkg-config build its
      # bindgen bindings. The default workspace build does NOT use them (OCR is behind
      # the non-default `ocr-tesseract` feature — it stays decoupled); they are present
      # so the dedicated OCR feature step below compiles + tests that impl.
      - name: system deps (OCR)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            tesseract-ocr libtesseract-dev libleptonica-dev tesseract-ocr-eng \
            clang pkg-config
      # --locked: build against the committed Cargo.lock. Without it CI re-resolves and can pull
      # a newer transitive (e.g. pgvector → sqlx 0.9 vs the workspace's 0.8), which fails to
      # compile; the lock pins one sqlx for every crate.
      - name: build
        run: cargo build --workspace --all-targets --locked
      - name: test
        run: cargo test --workspace --locked
      # The `oauth` feature is NOT in the default build, so the workspace `build`/`test` above
      # never compile the OAuth surface (gt-auth http handlers + the composition wiring) — a
      # missing export there (e.g. CliCodeStore, hq-gt-login-oauth) only surfaced in the
      # `:embeddings` image build (--features oauth). Compile + test it here so a broken oauth
      # build is a CI failure, not a deploy-time one. Mirrors what Dockerfile.embeddings builds.
      - name: oauth feature (gt-auth + composition)
        run: |
          cargo test -p gt-auth --features "oauth pg" --locked
          cargo build -p gt-composition --bin gt-mcp-server --features oauth --locked
      # The feature-gated tesseract OcrEngine impl — built/tested only here where its
      # system libs exist, so a default local build stays free of the OCR dependency.
      - name: ocr feature (tesseract)
        run: cargo test -p gt-docs-extract --features ocr-tesseract --locked
      # The feature-gated fastembed Embedder impl (hq-docs-search.2). Build-only + report-only:
      # the ML stack (onnxruntime via `ort`) and model download are heavy/network-dependent, so
      # this proves the impl compiles without gating CI on the toolchain being present.
      - name: embeddings feature (fastembed)
        run: cargo build -p gt-docs-embed --features embeddings-fastembed --locked
        continue-on-error: true
      # Report-only until the standing debt is cleared (see header).
      - name: fmt (report-only)
        run: cargo fmt --all --check
        continue-on-error: true
      - name: clippy (report-only)
        run: cargo clippy --workspace --all-targets --locked
        continue-on-error: true

  contract:
    runs-on: ubuntu-latest
    services:
      # A fresh dolthub image only grants root@localhost; a connection through
      # the runner's port map arrives from a non-local host, so root@'%' is
      # required for the test to authenticate (DOLT_ROOT_HOST=%).
      dolt:
        image: dolthub/dolt-sql-server:latest
        env:
          DOLT_ROOT_HOST: "%"
        ports:
          - 3306:3306
      postgres:
        # pgvector image (not stock postgres): migration 0003 runs `CREATE EXTENSION vector`
        # for the phase-2 semantic search column (hq-docs-search.2). The stock image lacks it,
        # so the gt-store-pg `--features pg` contract would fail applying the docs migrations.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: gtapp
          POSTGRES_PASSWORD: test
          POSTGRES_DB: gtapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gtapp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: wait for dolt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq default-mysql-client
          for _ in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -u root --silent 2>/dev/null; then
              echo "dolt ready"
              exit 0
            fi
            sleep 2
          done
          echo "dolt did not become ready" >&2
          exit 1
      # Dolt-backed issues store. SERIAL: the suite reseeds one shared
      # gt_rs_issues_test table (never the live hq), so parallel threads race.
      - name: dolt contract
        env:
          GT_DOLT_URL: mysql://root@127.0.0.1:3306
        run: cargo test -p gt-store-dolt --test issues_contract --locked -- --test-threads=1
      # The issues MCP resource reads (gt://issues page envelope + gt://issue/{id}
      # NotFound, hq-mcp-test.3). Own throwaway DB (gt_rs_resources_test), so it
      # neither touches live hq nor races the store fixture above.
      - name: issues resources contract
        env:
          GT_DOLT_URL: mysql://root@127.0.0.1:3306
        run: cargo test -p gt-issues --test resources_contract --locked
      # Postgres-backed schema migration + workspace-scoped feature flags.
      - name: pg contract
        env:
          GT_PG_URL: postgres://gtapp:test@127.0.0.1:5432/gtapp
        run: |
          # --features pg activates the WorkspacePool + DocumentsRepository (hq-docs-store.3)
          # contract tests, which are #[cfg(feature = "pg")] and otherwise compile out. The
          # documents_contract suite also covers the dedup / list-by-owner-id / hybrid-search
          # beads (hq-docs-test-store.2/.4, hq-docs-test-search.2/.3).
          cargo test -p gt-store-pg --features pg --locked
          cargo test -p gt-feature-flags --locked
          # The documents.* dispatch + resource-read + multi-tenant isolation integration
          # (hq-docs-test-api.1/.2/.3, hq-docs-test-mt.1): drives the production DocumentsHandler
          # + PgDocumentsResource over the per-workspace Postgres (fs blob store — no object
          # store needed for these beads; the MinIO path is the report-only e2e step below).
          cargo test -p gt-composition --test documents_dispatch --locked
          # The durable Postgres audit sink (hq-mcp-test.6): per-tenant isolation +
          # the restart-durability proof (write, drop the pool, reconnect, the trail
          # is still there). SERIAL — both gated tests reseed the one mcp_audit table.
          cargo test -p gt-mcp-server --locked -- --test-threads=1
      # The object-store beads (hq-docs-test-blob.2, hq-docs-test-e2e.*): the S3 backend
      # roundtrip/presign and the full-stack attach→inline→search→presign flow against a
      # live MinIO + Postgres. Report-only, and MinIO is started here with `docker run`
      # rather than as a job `services:` container ON PURPOSE: a service-container init
      # failure fails the whole job (skipping the hard-gated pg steps above), whereas a
      # failure inside this step is contained by continue-on-error. The schema/dispatch
      # beads already cover the document store without an object store.
      - name: documents object-store e2e (report-only)
        continue-on-error: true
        env:
          GT_PG_URL: postgres://gtapp:test@127.0.0.1:5432/gtapp
          GT_BLOB_ENDPOINT: http://127.0.0.1:9000
          GT_BLOB_BUCKET: gt-documents
          GT_BLOB_REGION: us-east-1
          GT_BLOB_ACCESS_KEY: minioadmin
          GT_BLOB_SECRET_KEY: minioadmin
        run: |
          docker run -d --name gt-minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9000/minio/health/live >/dev/null 2>&1; then
              echo "minio ready"; break
            fi
            sleep 2
          done
          # Provision the bucket the blob store writes to.
          docker run --rm --network host --entrypoint sh minio/mc -c \
            'mc alias set loc http://127.0.0.1:9000 minioadmin minioadmin && mc mb -p loc/gt-documents'
          cargo test -p gt-store-blob --locked s3_backend_roundtrips_and_presigns
          cargo test -p gt-composition --test documents_e2e --locked
