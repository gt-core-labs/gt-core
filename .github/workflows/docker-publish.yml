# Build + push the gt-mcp-server image to DockerHub on every push to main.
#
# Publishes codecsrayo/gt-core-mcp-server:
#   - :latest         moving tag, what compose pulls (pull_policy: always)
#   - :sha-<7>        immutable per-commit tag for rollback / pinning
#
# Requires two repo secrets (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME  e.g. codecsrayo
#   DOCKERHUB_TOKEN     a DockerHub PAT with Read & Write scope
name: docker-publish

on:
  push:
    branches: [main]
    # Skip image rebuilds for doc-only / CI-only changes.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: codecsrayo/gt-core-mcp-server
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
