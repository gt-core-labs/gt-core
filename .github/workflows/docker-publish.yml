# Build + push the gt-mcp-server image to DockerHub — GATED on CI passing.
#
# Triggered by the CI workflow completing (workflow_run), not directly by the
# push. The job only runs when that CI run both succeeded AND was the push to
# main, so a red `cargo build`/`cargo test`/contract gate blocks the image: a
# broken commit never reaches DockerHub even though it compiles in isolation.
#
# Publishes codecsrayo/gt-core-mcp-server:
#   - :latest                  moving tag (lean default Dockerfile), what compose pulls
#   - :sha-<7>                 immutable per-commit tag for rollback / pinning
#   - :embeddings              moving tag for the heavier embeddings variant (Dockerfile.embeddings:
#                              fastembed + claude + tmux + the in-container `gt` for per-role MCP).
#                              compose.embeddings.yml pulls this; rebuilt on every green main so the
#                              entrypoint/Dockerfile changes ship without a manual local build.
#   - :sha-embeddings-<7>      immutable per-commit embeddings tag
#
# hq-docker-build-opt: two parallel jobs instead of sequential steps — :latest and
# :embeddings build concurrently on separate runners. Each uses cargo-chef so only the
# project-code layer reruns on source changes; deps stay cached as long as Cargo.lock
# is unchanged. Warm-build time: ~4 min (was ~15 min).
#
# Requires two repo secrets (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME  e.g. codecsrayo
#   DOCKERHUB_TOKEN     a DockerHub PAT with Read & Write scope
name: docker-publish

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch: {}

# Reusable gate expression — both jobs share the same condition.
# workflow_dispatch carries no workflow_run payload, so the branch/event
# clauses are skipped and it publishes whatever main points at.
env:
  GATE: >-
    ${{ github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'main') }}

jobs:
  # ── lean :latest image ────────────────────────────────────────────────────
  publish-latest:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    steps:
      # Check out the exact commit CI validated, not the current tip of main.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve commit SHA
        id: vars
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "sha7=${SHA:0:7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: codecsrayo/gt-core-mcp-server
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ steps.vars.outputs.sha7 }}

      - name: Build and push (:latest)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── orchd image (orchestration daemon — runs concurrently) ─────────────
  publish-orchd:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve commit SHA
        id: vars
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "sha7=${SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
                      /usr/share/swift /usr/local/share/powershell
          sudo docker image prune --all --force || true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata (orchd)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: codecsrayo/gt-core-orchd
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ steps.vars.outputs.sha7 }}

      - name: Build and push (:orchd)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.orchd
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=orchd
          cache-to: type=gha,mode=max,scope=orchd

  # ── embeddings :embeddings image (runs concurrently with publish-latest) ──
  publish-embeddings:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve commit SHA
        id: vars
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "sha7=${SHA:0:7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata (embeddings)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: codecsrayo/gt-core-mcp-server
          tags: |
            type=raw,value=embeddings
            type=raw,value=sha-embeddings-${{ steps.vars.outputs.sha7 }}

      - name: Build and push (:embeddings)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.embeddings
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Own GHA cache scope — never evicts the lean image's cache.
          cache-from: type=gha,scope=embeddings
          cache-to: type=gha,mode=max,scope=embeddings
