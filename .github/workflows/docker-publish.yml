# Build + push the gt-mcp-server image to DockerHub — GATED on CI passing.
#
# Triggered by the CI workflow completing (workflow_run), not directly by the
# push. The job only runs when that CI run both succeeded AND was the push to
# main, so a red `cargo build`/`cargo test`/contract gate blocks the image: a
# broken commit never reaches DockerHub even though it compiles in isolation.
#
# Publishes codecsrayo/gt-core-mcp-server:
#   - :latest                  moving tag (lean default Dockerfile), what compose pulls
#   - :sha-<7>                 immutable per-commit tag for rollback / pinning
#   - :embeddings              moving tag for the heavier embeddings variant (Dockerfile.embeddings:
#                              fastembed + claude + tmux + the in-container `gt` for per-role MCP).
#                              compose.embeddings.yml pulls this; rebuilt on every green main so the
#                              entrypoint/Dockerfile changes ship without a manual local build.
#   - :sha-embeddings-<7>      immutable per-commit embeddings tag
#
# Trade-off vs the old direct-push trigger: workflow_run carries no paths-ignore,
# so the docs-only / md-only skip is gone. CI runs on every push regardless, so
# the only cost is an extra (cached) image build on doc-only commits to main.
#
# Requires two repo secrets (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME  e.g. codecsrayo
#   DOCKERHUB_TOKEN     a DockerHub PAT with Read & Write scope
name: docker-publish

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    # Gate: CI must have succeeded, on a push to main. workflow_dispatch (manual)
    # carries no workflow_run payload, so the branch/event clauses are skipped for
    # it and it publishes whatever main points at.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    steps:
      # Check out the exact commit CI validated, not the current tip of main
      # (which may have advanced past the SHA that passed the gate).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve commit SHA
        id: vars
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "sha7=${SHA:0:7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: codecsrayo/gt-core-mcp-server
          # sha tag is built from the CI-validated commit, not github.sha (which
          # in the workflow_run context resolves to the default-branch tip).
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ steps.vars.outputs.sha7 }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The embeddings variant — same commit, heavier image (fastembed + claude + tmux + the
      # in-container `gt` binary for per-role MCP, hq-role-mcp / hq-gt-container). compose.embeddings.yml
      # pulls :embeddings, so building it here ships the Dockerfile.embeddings/entrypoint changes
      # without a manual local build. Own gha cache scope so it never evicts the lean image's cache.
      - name: Docker metadata (embeddings)
        id: meta_emb
        uses: docker/metadata-action@v5
        with:
          images: codecsrayo/gt-core-mcp-server
          tags: |
            type=raw,value=embeddings
            type=raw,value=sha-embeddings-${{ steps.vars.outputs.sha7 }}

      - name: Build and push (embeddings)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.embeddings
          push: true
          tags: ${{ steps.meta_emb.outputs.tags }}
          labels: ${{ steps.meta_emb.outputs.labels }}
          cache-from: type=gha,scope=embeddings
          cache-to: type=gha,mode=max,scope=embeddings
