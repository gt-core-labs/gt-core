# Deploy to the Talos cluster — GATED on the full CI → docker-publish chain.
#
# The chain is:
#   1. CI (cargo test + contract)         — hard gate on every push/PR
#   2. docker-publish (build+push images) — only runs on green CI + push to main
#   3. deploy (this workflow)             — only runs on green docker-publish
#
# Two environments roll out from the same green chain:
#   - deploy-dev  → ns gt   (gt-dev.codecsrayo.com)
#   - deploy-prod → ns gt-prod (gt.codecsrayo.com), runs only after deploy-dev is
#     green so prod always trails a validated dev. Prod auto-follows main for
#     gt-core ONLY (mcp-server + orchd) — same coverage as dev; gt-web/gt-docs are
#     not published by CI (built by Tilt to the in-cluster registry) and stay out
#     of this automation. In prod, orchd runs the mcp-server image (gt-orch-server
#     bin), matching how gt-prod is deployed.
#
# Nothing reaches the cluster unless tests pass. Branch protection on main
# (require CI status checks) prevents direct pushes that skip the gate.
#
# Required secrets:
#   TS_OAUTH_CLIENT_ID     — Tailscale OAuth client ID (tag: tag:ci)
#   TS_OAUTH_SECRET        — Tailscale OAuth client secret
#   KUBE_CONFIG            — base64-encoded kubeconfig for the cluster
#   CLAUDE_CREDENTIALS     — claude CLI credentials JSON for orchd polecats
name: deploy

on:
  workflow_run:
    workflows: [docker-publish]
    types: [completed]
  workflow_dispatch: {}

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    steps:
      - name: Resolve commit SHA
        id: vars
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "sha7=${SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Set up kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Deploy MCP server
        run: |
          kubectl set image deploy/gt-mcp-server -n gt \
            mcp-server=codecsrayo/gt-core-mcp-server:sha-embeddings-${{ steps.vars.outputs.sha7 }}

      - name: Deploy orchd
        run: |
          kubectl set image deploy/gt-orchd -n gt \
            orchd=codecsrayo/gt-core-orchd:sha-${{ steps.vars.outputs.sha7 }}

      # Graceful drain on redeploy (gtcore-0179f8): the orchd SIGTERM handler commits + pushes every
      # in-flight worktree's pending work before exit (GT_DRAIN_TIMEOUT_SECS=90). k8s's default 30s
      # grace would SIGKILL it mid-drain, so widen it to 180s (> drain timeout + actor-stack teardown)
      # so the push completes. The chart (gt-app-proxy) is the long-term home; this patch enforces it
      # from the deploy that sets the image, and is idempotent.
      - name: Ensure orchd termination grace for drain
        run: |
          kubectl patch deploy/gt-orchd -n gt --type=strategic \
            -p '{"spec":{"template":{"spec":{"terminationGracePeriodSeconds":180}}}}'

      - name: Wait for rollouts
        run: |
          kubectl rollout status deploy/gt-mcp-server -n gt --timeout=180s
          kubectl rollout status deploy/gt-orchd -n gt --timeout=300s

      - name: Provision claude credentials
        run: |
          POD=$(kubectl get pods -n gt --field-selector=status.phase=Running -o name | grep orchd | head -1)
          POD=${POD#pod/}
          kubectl exec "$POD" -n gt -- mkdir -p /tmp/.claude
          echo '${{ secrets.CLAUDE_CREDENTIALS }}' > /tmp/creds.json
          kubectl cp /tmp/creds.json "gt/$POD:/tmp/.claude/.credentials.json"
          rm -f /tmp/creds.json

      - name: Verify orchd
        run: |
          POD=$(kubectl get pods -n gt --field-selector=status.phase=Running -o name | grep orchd | head -1)
          kubectl logs "${POD#pod/}" -n gt --tail=5

  # Prod (ns gt-prod, gt.codecsrayo.com) trails a validated dev: only runs after
  # deploy-dev is green. gt-core only — both prod deployments use the mcp-server
  # image (gt-prod-orchd runs the gt-orch-server bin from that image).
  deploy-prod:
    needs: deploy-dev
    runs-on: ubuntu-latest
    steps:
      - name: Resolve commit SHA
        id: vars
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "sha7=${SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Set up kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Deploy MCP server (prod)
        run: |
          kubectl set image deploy/gt-prod-mcp-server -n gt-prod \
            mcp-server=codecsrayo/gt-core-mcp-server:sha-embeddings-${{ steps.vars.outputs.sha7 }}

      - name: Deploy orchd (prod)
        run: |
          kubectl set image deploy/gt-prod-orchd -n gt-prod \
            orchd=codecsrayo/gt-core-mcp-server:sha-embeddings-${{ steps.vars.outputs.sha7 }}

      # Graceful drain on redeploy (gtcore-0179f8) — same as dev: widen the grace so the orchd's
      # SIGTERM drain (commit + push of in-flight worktrees) is not SIGKILLed mid-push.
      - name: Ensure prod orchd termination grace for drain
        run: |
          kubectl patch deploy/gt-prod-orchd -n gt-prod --type=strategic \
            -p '{"spec":{"template":{"spec":{"terminationGracePeriodSeconds":180}}}}'

      - name: Wait for rollouts (prod)
        run: |
          kubectl rollout status deploy/gt-prod-mcp-server -n gt-prod --timeout=180s
          kubectl rollout status deploy/gt-prod-orchd -n gt-prod --timeout=300s
