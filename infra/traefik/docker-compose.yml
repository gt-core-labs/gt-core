# Traefik como único punto de entrada + routers por labels para web y api.
#
# Alcance acotado a infra/traefik/ para no colisionar con los Dockerfiles
# (authapp-3cb595) ni el compose dev/prod (authapp-a8f0ff). Los servicios
# `web` y `api` aquí son placeholders: en el stack real se reemplazan por
# las imágenes construidas, conservando labels/networks.
services:
  traefik:
    image: traefik:v3.3
    restart: unless-stopped
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./traefik.yml:/etc/traefik/traefik.yml:ro"
      - "./dynamic:/etc/traefik/dynamic:ro"
      - "acme:/letsencrypt"
    networks:
      - web
    environment:
      # Requerido por el resolver Let's Encrypt (traefik.yml lo exige con ${...:?}).
      ACME_EMAIL: "${ACME_EMAIL:?ACME_EMAIL requerido}"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ── Web (SPA) — router de baja prioridad captura la raíz `/` ──────────
  web:
    image: "${WEB_IMAGE:-traefik/whoami}"
    restart: unless-stopped
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`${APP_HOST:?APP_HOST requerido}`) && PathPrefix(`/`)"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.tls=true"
      - "traefik.http.routers.web.tls.certresolver=letsencrypt"
      - "traefik.http.routers.web.priority=1"
      - "traefik.http.routers.web.middlewares=web-chain@file"
      - "traefik.http.services.web.loadbalancer.server.port=80"

  # ── API — router de alta prioridad captura `/api` antes que web ───────
  api:
    image: "${API_IMAGE:-traefik/whoami}"
    restart: unless-stopped
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`${APP_HOST:?APP_HOST requerido}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.api.priority=100"
      - "traefik.http.routers.api.middlewares=api-chain@file"
      - "traefik.http.services.api.loadbalancer.server.port=80"

networks:
  web:
    name: web

volumes:
  # Persiste acme.json → renovación automática sin re-emitir certificados.
  acme: {}
