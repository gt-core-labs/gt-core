[workspace]
resolver = "2"
members = [
    "crates/kernel/gt-events",
    "crates/kernel/gt-beads",
    "crates/kernel/gt-eventlog",
    "crates/kernel/gt-bus",
    "crates/kernel/gt-channel",
    "crates/kernel/gt-telemetry",
    "crates/kernel/gt-plugin",
    "crates/kernel/gt-module",
    "crates/kernel/gt-module-mcp",
    "crates/kernel/gt-module-migrate",
    "crates/kernel/gt-module-contracts",
    "crates/kernel/gt-feature-flags",
    "crates/kernel/gt-hooks",
    "crates/kernel/gt-graphindex",
    "crates/domain/platform/gt-workspace",
    "crates/domain/platform/gt-auth",
    "crates/domain/platform/gt-issues",
    "crates/domain/platform/gt-meta",
    "crates/domain/platform/gt-rig",
    "crates/domain/platform/gt-feed",
    "crates/domain/platform/gt-skills",
    "crates/domain/lifecycle/gt-agent",
    "crates/domain/lifecycle/gt-polecat",
    "crates/domain/roles/gt-sheriff",
    "crates/domain/roles/gt-deacon",
    "crates/domain/roles/gt-refinery",
    "crates/domain/roles/gt-witness",
    "crates/domain/roles/gt-graphwarden",
    "crates/domain/roles/gt-mayor",
    "crates/domain/roles/gt-roles",
    "crates/domain/orchestration/gt-quota",
    "crates/domain/orchestration/gt-merge",
    "crates/domain/orchestration/gt-patrol",
    "crates/domain/orchestration/gt-scheduling",
    "crates/domain/orchestration/gt-orchestration",
    "crates/domain/orchestration/gt-webhooks",
    "crates/domain/orchestration/gt-dog",
    "crates/domain/orchestration/gt-runtime",
    "crates/domain/orchestration/gt-mcp-server",
    "crates/domain/orchestration/gt-reconciler",
    "crates/domain/orchestration/gt-memory",
    "crates/domain/orchestration/gt-planner",
    "crates/modules/mod-beads",
    "crates/modules/gt-composition",
    "crates/kernel/gt-store-pg",
    "crates/kernel/gt-store-dolt",
    "crates/kernel/gt-rbac",
    "crates/kernel/gt-audit",
    "examples/mod-hello",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/codecsrayo/gt-core"
authors = ["codecsrayo"]

[workspace.dependencies]
# Async + serde core
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "0.8", features = ["preserve_order"] }
semver = { version = "1", features = ["serde"] }
async-trait = "0.1"
utoipa = { version = "5", features = ["debug"] }

# Web + axum
axum = "0.7"
async-stream = "0.3"
futures-core = "0.3"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }

# Crypto — webhook signature verification (hq-mod-hooks.5+)
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# Storage
sqlx = { version = "0.8", default-features = false, features = ["postgres", "macros", "runtime-tokio-rustls", "uuid", "chrono"] }
# MySQL-wire client for Dolt (:3307); lifted issues store (hq-core-host.1). No
# TLS (local Dolt), minimal deps.
mysql_async = { version = "0.34", default-features = false, features = ["minimal"] }
thiserror = "2"
# Event kernel (hq-core-port.10) — ulid for Envelope event ids, time for RFC3339 stamps.
ulid = "1"
# Cross-platform advisory file lock for the gt-eventlog jsonl writer (hq-core-port.8).
fs2 = "0.4"
# Temp dirs/files — gt-plugin descriptor scanner + its tests (hq-core-port.11).
tempfile = "3"
# Filesystem watch for the gt-channel mailbox (hq-core-port.14).
notify = "6"
time = { version = "0.3", features = ["std", "formatting"] }
# RBAC config parser — gt-rbac reads TOML or JSON (hq-core-host.4).
toml = "0.8"
# Lock-free concurrent map (per-workspace RootRegistry, hq-mt-routing.1).
dashmap = "6"
# Raw flock(2) for the per-workspace Dolt data-dir guard (hq-mt-data.12).
libc = "0.2"

# Telemetry
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opentelemetry = "0.27"

# MCP server transport (hq-core-host.3) — official rmcp SDK, streamable-HTTP.
rmcp = { version = "1.7", features = ["server", "transport-streamable-http-server"] }
anyhow = "1"

# Internal crates — referenced as `<name> = { workspace = true }` from member Cargo.toml.
# Path-centralized here so members never juggle relative paths across tiers.
gt-events        = { path = "crates/kernel/gt-events" }
gt-beads         = { path = "crates/kernel/gt-beads" }
gt-eventlog      = { path = "crates/kernel/gt-eventlog" }
gt-bus           = { path = "crates/kernel/gt-bus" }
gt-channel       = { path = "crates/kernel/gt-channel" }
gt-telemetry     = { path = "crates/kernel/gt-telemetry" }
gt-plugin        = { path = "crates/kernel/gt-plugin" }
gt-module        = { path = "crates/kernel/gt-module" }
gt-module-mcp       = { path = "crates/kernel/gt-module-mcp" }
gt-module-migrate   = { path = "crates/kernel/gt-module-migrate" }
gt-module-contracts = { path = "crates/kernel/gt-module-contracts" }
gt-feature-flags = { path = "crates/kernel/gt-feature-flags" }
gt-hooks         = { path = "crates/kernel/gt-hooks" }
gt-graphindex    = { path = "crates/kernel/gt-graphindex" }
gt-workspace     = { path = "crates/domain/platform/gt-workspace" }
gt-auth          = { path = "crates/domain/platform/gt-auth" }
gt-meta          = { path = "crates/domain/platform/gt-meta" }
gt-issues        = { path = "crates/domain/platform/gt-issues" }
gt-rig           = { path = "crates/domain/platform/gt-rig" }
gt-feed          = { path = "crates/domain/platform/gt-feed" }
gt-skills        = { path = "crates/domain/platform/gt-skills" }
gt-agent         = { path = "crates/domain/lifecycle/gt-agent" }
gt-polecat       = { path = "crates/domain/lifecycle/gt-polecat" }
gt-sheriff       = { path = "crates/domain/roles/gt-sheriff" }
gt-deacon        = { path = "crates/domain/roles/gt-deacon" }
gt-refinery      = { path = "crates/domain/roles/gt-refinery" }
gt-witness       = { path = "crates/domain/roles/gt-witness" }
gt-graphwarden   = { path = "crates/domain/roles/gt-graphwarden" }
gt-mayor         = { path = "crates/domain/roles/gt-mayor" }
gt-roles         = { path = "crates/domain/roles/gt-roles" }
gt-quota         = { path = "crates/domain/orchestration/gt-quota" }
gt-merge         = { path = "crates/domain/orchestration/gt-merge" }
gt-patrol        = { path = "crates/domain/orchestration/gt-patrol" }
gt-scheduling    = { path = "crates/domain/orchestration/gt-scheduling" }
gt-orchestration = { path = "crates/domain/orchestration/gt-orchestration" }
gt-webhooks      = { path = "crates/domain/orchestration/gt-webhooks" }
gt-dog           = { path = "crates/domain/orchestration/gt-dog" }
gt-runtime       = { path = "crates/domain/orchestration/gt-runtime" }
gt-memory        = { path = "crates/domain/orchestration/gt-memory" }
gt-planner       = { path = "crates/domain/orchestration/gt-planner" }
gt-mcp-server    = { path = "crates/domain/orchestration/gt-mcp-server" }

gt-store-pg      = { path = "crates/kernel/gt-store-pg" }
gt-store-dolt    = { path = "crates/kernel/gt-store-dolt" }
gt-rbac          = { path = "crates/kernel/gt-rbac" }
gt-audit         = { path = "crates/kernel/gt-audit" }

# Reused from gastown until P4 (foundation kernel crates):
# gt-bus, gt-plugin, gt-telemetry remain in gastown. gt-events PORTED UP
# (hq-core-port.10, 2026-06-02) now the freeze gate refactor.10..12 closed
# replay-green. NOTE: gt-core's gt-audit here is the MCP dispatch audit SINK
# (hq-core-host.4), a different concept from gastown's event-replay gt-audit
# (EventStore) that migrates up in P4 — a name collision to resolve then
# (cf. gt-workspace → gt-townroot).

[profile.release]
lto = "thin"
codegen-units = 1
