[workspace]
resolver = "2"
members = [
    "crates/kernel/gt-module",
    "crates/kernel/gt-module-routes",
    "crates/kernel/gt-module-mcp",
    "crates/kernel/gt-module-events",
    "crates/kernel/gt-module-migrate",
    "crates/kernel/gt-module-contracts",
    "crates/kernel/gt-feature-flags",
    "crates/kernel/gt-hooks",
    "crates/domain/platform/gt-workspace",
    "crates/domain/orchestration/gt-webhooks",
    "crates/domain/orchestration/gt-dog",
    "crates/kernel/gt-store-pg",
    "crates/domain/platform/gt-store-pg-workspace",
    "examples/mod-hello",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/codecsrayo/gt-core"
authors = ["codecsrayo"]

[workspace.dependencies]
# Async + serde core
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "0.8", features = ["preserve_order"] }
semver = { version = "1", features = ["serde"] }
async-trait = "0.1"
utoipa = { version = "5", features = ["debug"] }

# Web + axum
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }

# Crypto — webhook signature verification (hq-mod-hooks.5+)
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# Storage
sqlx = { version = "0.8", default-features = false, features = ["postgres", "macros", "runtime-tokio-rustls", "uuid", "chrono"] }

# Telemetry
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opentelemetry = "0.27"

# Internal crates — referenced as `<name> = { workspace = true }` from member Cargo.toml.
# Path-centralized here so members never juggle relative paths across tiers.
gt-module        = { path = "crates/kernel/gt-module" }
gt-module-routes    = { path = "crates/kernel/gt-module-routes" }
gt-module-mcp       = { path = "crates/kernel/gt-module-mcp" }
gt-module-events    = { path = "crates/kernel/gt-module-events" }
gt-module-migrate   = { path = "crates/kernel/gt-module-migrate" }
gt-module-contracts = { path = "crates/kernel/gt-module-contracts" }
gt-feature-flags = { path = "crates/kernel/gt-feature-flags" }
gt-hooks         = { path = "crates/kernel/gt-hooks" }
gt-workspace     = { path = "crates/domain/platform/gt-workspace" }
gt-webhooks      = { path = "crates/domain/orchestration/gt-webhooks" }
gt-dog           = { path = "crates/domain/orchestration/gt-dog" }

gt-store-pg      = { path = "crates/kernel/gt-store-pg" }

gt-store-pg-workspace = { path = "crates/domain/platform/gt-store-pg-workspace" }

# Reused from gastown until P4 (foundation kernel crates):
# gt-events, gt-bus, gt-audit, gt-plugin, gt-telemetry remain in gastown.

[profile.release]
lto = "thin"
codegen-units = 1
