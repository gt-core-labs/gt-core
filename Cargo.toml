[workspace]
resolver = "2"
members = [
    "crates/kernel/gt-module",
    "crates/kernel/gt-module-mcp",
    "crates/kernel/gt-module-migrate",
    "crates/kernel/gt-module-contracts",
    "crates/kernel/gt-feature-flags",
    "crates/kernel/gt-hooks",
    "crates/domain/platform/gt-workspace",
    "crates/domain/platform/gt-issues",
    "crates/domain/platform/gt-meta",
    "crates/domain/orchestration/gt-webhooks",
    "crates/domain/orchestration/gt-dog",
    "crates/domain/orchestration/gt-runtime",
    "crates/domain/orchestration/gt-mcp-server",
    "crates/kernel/gt-store-pg",
    "crates/kernel/gt-store-dolt",
    "crates/kernel/gt-rbac",
    "crates/kernel/gt-audit",
    "examples/mod-hello",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/codecsrayo/gt-core"
authors = ["codecsrayo"]

[workspace.dependencies]
# Async + serde core
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "0.8", features = ["preserve_order"] }
semver = { version = "1", features = ["serde"] }
async-trait = "0.1"
utoipa = { version = "5", features = ["debug"] }

# Web + axum
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }

# Crypto — webhook signature verification (hq-mod-hooks.5+)
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# Storage
sqlx = { version = "0.8", default-features = false, features = ["postgres", "macros", "runtime-tokio-rustls", "uuid", "chrono"] }
# MySQL-wire client for Dolt (:3307); lifted issues store (hq-core-host.1). No
# TLS (local Dolt), minimal deps.
mysql_async = { version = "0.34", default-features = false, features = ["minimal"] }
thiserror = "2"
# RBAC config parser — gt-rbac reads TOML or JSON (hq-core-host.4).
toml = "0.8"
# Lock-free concurrent map (per-workspace RootRegistry, hq-mt-routing.1).
dashmap = "6"

# Telemetry
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opentelemetry = "0.27"

# MCP server transport (hq-core-host.3) — official rmcp SDK, streamable-HTTP.
rmcp = { version = "1.7", features = ["server", "transport-streamable-http-server"] }
anyhow = "1"

# Internal crates — referenced as `<name> = { workspace = true }` from member Cargo.toml.
# Path-centralized here so members never juggle relative paths across tiers.
gt-module        = { path = "crates/kernel/gt-module" }
gt-module-mcp       = { path = "crates/kernel/gt-module-mcp" }
gt-module-migrate   = { path = "crates/kernel/gt-module-migrate" }
gt-module-contracts = { path = "crates/kernel/gt-module-contracts" }
gt-feature-flags = { path = "crates/kernel/gt-feature-flags" }
gt-hooks         = { path = "crates/kernel/gt-hooks" }
gt-workspace     = { path = "crates/domain/platform/gt-workspace" }
gt-meta          = { path = "crates/domain/platform/gt-meta" }
gt-issues        = { path = "crates/domain/platform/gt-issues" }
gt-webhooks      = { path = "crates/domain/orchestration/gt-webhooks" }
gt-dog           = { path = "crates/domain/orchestration/gt-dog" }
gt-runtime       = { path = "crates/domain/orchestration/gt-runtime" }

gt-store-pg      = { path = "crates/kernel/gt-store-pg" }
gt-store-dolt    = { path = "crates/kernel/gt-store-dolt" }
gt-rbac          = { path = "crates/kernel/gt-rbac" }
gt-audit         = { path = "crates/kernel/gt-audit" }

# Reused from gastown until P4 (foundation kernel crates):
# gt-events, gt-bus, gt-plugin, gt-telemetry remain in gastown. NOTE: gt-core's
# gt-audit here is the MCP dispatch audit SINK (hq-core-host.4), a different
# concept from gastown's event-replay gt-audit (EventStore) that migrates up in
# P4 — a name collision to resolve then (cf. gt-workspace → gt-townroot).

[profile.release]
lto = "thin"
codegen-units = 1
