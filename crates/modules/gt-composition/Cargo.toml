[package]
name = "gt-composition"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Composition root: per-workspace assembly of the module Root + role/scheduler/merge observers on the event hub (compose_workspace / live_root). The app entry, not a GtModule."

# The composition root is the app entry that assembles every domain into one per-workspace Root.
# It is NOT a GtModule — but it must name scheduling + patrol + merge + roles together, and the
# docs/03 Rule 4 table permits exactly `roles`, `modules`, and `examples` to depend on all
# `domain/*`. It lives in the `modules` tier as the dependency-legal production home (owner call,
# hq-mod-refactor.26); a dedicated `crates/app/` tier would be the semantically-pure home but
# needs a Rule-2 tier approval (still open under refactor.13).
[dependencies]
gt-plugin = { workspace = true }
# `pg` compiles the SYNCHRONOUS Postgres-backed EventStore (hq-talos-migration.10): the bin selects
# it by env (GT_EVENTLOG_PG / GT_PG_URL) so N mcp-server replicas + a separate orchd write the event
# log over one Postgres — no shared volume. The file backend (JsonlWriter) stays the default fallback.
gt-eventlog = { workspace = true, features = ["pg"] }
gt-events = { workspace = true }
gt-scheduling = { workspace = true }
# merge.* dispatch (hq-mcp-dispatch.5): event-sourced MergeBoard. `axum` adds the REST surface
# + the WorkspaceMerges port the composition EventLog provider backs (hq-fe-api-mount.3).
gt-merge = { workspace = true, features = ["axum"] }
# convoy.* dispatch (hq-mcp-dispatch.6): event-sourced ConvoyBoard. `axum` adds the REST
# surface + the WorkspaceConvoy port the composition EventLog provider backs (hq-web-extras.16):
# EventLogConvoy replays the tenant's `convoy.*` stream into the board and appends decided events.
gt-orchestration = { workspace = true, features = ["axum"] }
# agent.* dispatch (hq-mcp-dispatch.7): event-sourced SessionRegistry. `axum` adds the
# REST surface (AgentApiState over the event-log root) the bin mounts at /api/v1/agent
# (hq-fe-api-mount.1).
gt-agent = { workspace = true, features = ["axum"] }
# quota.* dispatch (hq-mcp-dispatch.4): event-sourced AccountRegistry. `axum` adds the
# REST surface + the WorkspaceQuota port the composition EventLog provider backs
# (hq-fe-api-mount.1).
gt-quota = { workspace = true, features = ["axum"] }
# Read-only skills.read REST surface (hq-web-extras.13): `axum` adds the surface + the
# WorkspaceSkills port the composition EventLog provider backs (EventLogSkills replays the
# tenant's `skills.*` stream into the catalog).
gt-skills = { workspace = true, features = ["axum"] }
# Global Claude Code hook registry (hq-hooks): the HooksStore port the composition EventLog
# provider backs (EventLogHooks folds the global `hooks.*` stream), + the domain the `hooks.rs`
# REST router + the terminal `.claude/settings.json` materialiser read through.
gt-claude-hooks = { workspace = true }
# Read-only feed.read REST surface (hq-web-extras.14): `axum` adds the surface + the
# WorkspaceFeed port the composition EventLog provider backs (EventLogFeed folds the tenant's
# whole log into the FeedState projection).
gt-feed = { workspace = true, features = ["axum"] }
# Per-workspace consumed-token counter (hq-mt-deploy.8): bump
# gt_workspace_quota_consumed on each quota.sample.
gt-telemetry = { workspace = true }
gt-patrol = { workspace = true }
# Refinery MERGE_READY loop (hq-orchd.4): the daemon awaits MERGE_READY on a gt-channel.
# `pg` (hq-talos-migration.11): the Postgres-backed dispatch queue so the convoy→scheduler bridge
# can run without the shared-volume coupling, selected by GT_EVENTLOG_PG like the event log.
gt-channel = { workspace = true, features = ["pg"] }
# Polecat supervision (hq-orchd.3): the daemon slings spawn_tmux polecats on dispatch +
# re-slings dead ones via PolecatSupervisor, bounded by the PoolAllocator admission core.
gt-polecat = { workspace = true }
gt-runtime = { workspace = true }
gt-roles = { workspace = true }
gt-beads = { workspace = true }
gt-module = { workspace = true }
# PG-backed domain dispatch (hq-mcp-dispatch.2): the workspace handler drives the
# `pg` adapter (PgWorkspaces) of the gt-workspace port over a shared PgPool. `axum`
# adds the WorkspaceContext extractor + WorkspaceClaim the auth middleware injects
# (hq-auth-context.3).
gt-workspace = { workspace = true, features = ["pg", "axum"] }
# Authentication port (Authenticator/JwtClaims) for the HTTP auth middleware
# (hq-auth-context.3): verify a bearer token, inject the verified claim. The
# `jsonwebtoken` feature pulls the concrete RS256 verifier (JwtAuthenticator::from_env)
# the gt-mcp-server bin mounts in front of the REST surface (hq-auth-routes.2).
gt-auth = { workspace = true, features = ["jsonwebtoken", "pg", "axum"] }
# rig.* dispatch (hq-mcp-dispatch.3): PgRigs over a per-workspace schema pool. `axum`
# adds the REST surface + the WorkspaceRigs port the composition WsPools provider backs
# (hq-fe-api-mount.1).
gt-rig = { workspace = true, features = ["pg", "axum"] }
# connection.* (hq-vcs-connections.1): the per-workspace VCS-connection store + REST CRUD. `pg`
# wires PgVcsConnections over the shared pool; `axum` adds the `/api/v1/connection` surface mounted
# behind the connection.read/connection.write guard. The sealed PAT reuses gt-auth's secret-crypto.
gt-vcs = { workspace = true, features = ["pg", "axum"] }
# graph.* dispatch (hq-graphrig.10): GraphIndexer port (+ graphify adapter for the live
# server) and the warden state replayed to resolve rig -> repo_dir. The `axum` feature
# (hq-vcs-connections.9) mounts the read-only graph REST surface + the refresh route so the FE
# complemento reaches graph.status/refresh over the same authenticated HTTP path.
gt-graphindex = { workspace = true, features = ["graphify", "axum"] }
gt-graphwarden = { workspace = true }
# Inbound webhook verify (hq-vcs-connections.7): reuse `GitHubSource`'s constant-time HMAC-SHA256
# verification of `X-Hub-Signature-256` for the GitHub App push webhook, rather than re-rolling the
# MAC compare. Sync + pure, behind the REST receiver in `webhook.rs`.
gt-webhooks = { workspace = true }
# Per-workspace schema isolation: WorkspacePool sets search_path per connection.
gt-store-pg = { workspace = true, features = ["pg"] }
# Document subsystem dispatch (hq-docs-api.2): the GtModule contract (gt-documents),
# the per-workspace DocumentsRepository (gt-store-pg `pg`), the blob store, and the
# text extractor. base64 decodes attach payloads; ulid mints doc ids; sha2 dedups.
gt-documents = { workspace = true, features = ["axum"] }
# Threaded comments contract (hq-57042e): comments.* tool shapes + @mention parser.
gt-comments = { workspace = true }
# Email transport seam (hq-f24599): LogTransport now, SMTP later by config.
gt-notify = { workspace = true }
chrono = { workspace = true }
# Unguessable invite tokens (hq-4231c1).
getrandom = { workspace = true }
gt-store-blob = { workspace = true }
gt-docs-extract = { workspace = true }
gt-docs-embed = { workspace = true }
# Semantic memory dispatch (hq-memory-mcp.3): the MemoryKind domain enum (for kind
# validation) backed by the per-workspace MemoryRepository (gt-store-pg `pg`).
gt-memory = { workspace = true }
base64 = { workspace = true }
ulid = { workspace = true }
sha2 = { workspace = true }
# Boot-time PG migration apply: gt-mcp-server self-seeds the public catalog
# (workspaces + feature flags) so a fresh deploy needs no operator migration step.
gt-module-migrate = { workspace = true }
async-trait = { workspace = true }
# Per-workspace SSE event stream (hq-mcp-dispatch.10): the poll-tail feed stream.
async-stream = { workspace = true }
futures-core = { workspace = true }
# Parse the RFC3339 record `ts` to compute agent-session durations (hq-orchd.6).
time = { workspace = true, features = ["parsing"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "process", "signal", "sync", "time", "io-util"] }

# The gt-mcp-server binary lives here (hq-mcp-dispatch): the modules tier is the
# one Rule-4-legal home for the per-domain DomainHandler wiring. It composes the
# gt-mcp-server library + the issues/meta modules + the domain handlers.
gt-mcp-server = { workspace = true }
# The `axum` feature compiles the issues REST adapter (hq-auth-routes.2): IssuesModule's
# register_routes/openapi + the http.rs router the bin mounts at /api/v1/issues.
gt-issues = { workspace = true, features = ["axum"] }
# The `axum` feature compiles the meta REST adapter (hq-fe-api-mount.2): MetaHttpModule's
# register_routes mounts GET /help + POST /report-gap under /api/v1/meta.
gt-meta = { workspace = true, features = ["axum"] }
gt-rbac = { workspace = true }
gt-audit = { workspace = true }
gt-store-dolt = { workspace = true }
mysql_async = { workspace = true }
rmcp = { workspace = true, features = ["server", "transport-streamable-http-server"] }
# `ws` adds the WebSocket extractor the interactive terminal (hq-terminal) upgrades on.
axum = { workspace = true, features = ["ws"] }
portable-pty = { workspace = true }
tower-http = { workspace = true, features = ["cors"] }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
# Server-side usage prober (hq-28b063 / usage_probe.rs): GET the OAuth /usage endpoint +
# the refresh-token POST — the edge half of gt-quota::oauth_usage. rustls, no OpenSSL.
reqwest = { workspace = true }

[features]
# Compile the local fastembed embedding engine into the server (hq-docs-search.2). Off by
# default — pulls the onnxruntime ML stack; enable for semantic/hybrid document search.
embeddings-fastembed = ["gt-docs-embed/embeddings-fastembed"]
# Compile the OAuth/OIDC login provider into the server (hq-platform-hardening.3 / hq-idp-db.2).
# Off by default — pulls gt-auth's `reqwest` HTTP client; enable to serve `POST /auth/login` with a
# `code`+`provider_id` resolved against the DB-backed `oauth_providers` store (GT_SECRET_KEY seals
# the client secrets; GT_OIDC_REDIRECT_URI + GT_OIDC_WORKSPACE are the per-deploy callback/tenant).
# Without it that path is 501.
oauth = ["gt-auth/oauth"]

[[bin]]
name = "gt-mcp-server"
path = "src/bin/gt-mcp-server.rs"

[[bin]]
name = "gt-orch-server"
path = "src/bin/gt-orch-server.rs"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }
serde_json = { workspace = true }
# Tempdir-rooted event logs for the event-sourced handler tests.
tempfile = { workspace = true }
# Drive the SSE feed router in-process (hq-mcp-test.7): `oneshot` a request and
# poll the streaming body frames.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"# Build a real OOXML (docx) blob in-test so the documents.attach blob path exercises
# genuine text extraction (hq-docs-test-api.2), no committed binary fixture.
zip = { version = "2", default-features = false, features = ["deflate"] }
# Build a real PDF blob for the full-stack e2e (hq-docs-test-e2e.2) — same lopdf the reader
# is built on, so the extractor reads it without a committed binary fixture.
lopdf = "0.34"
# Read each module's utoipa ApiDoc (the served REST spec) in the MCP↔HTTP parity
# contract (hq-fe-api-spec.2): harvest its declared (method, path) set offline.
utoipa = { workspace = true }
# Mint a valid X-Hub-Signature-256 in the webhook tests (hq-vcs-connections.7) to drive the
# signature-verify path; sha2 is already a runtime dep, hmac/hex are test-only here.
hmac = { workspace = true }
hex = { workspace = true }
# A bare sync `postgres::Client` for the PG-backed EventLog contract tests (hq-talos-migration.10):
# truncate the test workspaces + insert raw `public.events` rows with controlled `kind`/`ts` to
# exercise the prefix/channel/since/limit filters. Test-only; the runtime PG backend pools through
# gt-eventlog's `pg` feature.
postgres = { workspace = true }
