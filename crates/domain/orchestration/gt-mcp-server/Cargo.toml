[package]
name = "gt-mcp-server"
edition.workspace = true
version.workspace = true

# The gt-core MCP server (hq-core-host.3) — the transport pillar. Composes the
# issues module's tool DESCRIPTORS (via the kernel McpRegistry) + the lifted Dolt
# store, and serves them over the rmcp streamable-HTTP transport. The executable
# handlers come from gt-issues (transport-free run_*_issue free fns); this crate
# adds the rmcp ServerHandler wrapping (scope check + audit + dispatch).
#
# Library-only (hq-mcp-dispatch): the composing `gt-mcp-server` binary lives in
# `crates/modules/gt-composition`, the one tier that may depend on every
# `domain/*` crate to register the per-domain `DomainHandler`s (docs/03 Rule 4).
[dependencies]
gt-module = { workspace = true }
gt-module-mcp = { workspace = true }
gt-issues = { workspace = true }
gt-meta = { workspace = true }
gt-store-dolt = { workspace = true }
gt-rbac = { workspace = true }
gt-audit = { workspace = true }
# Per-workspace JWT auth at the server boundary (hq-mcp-dispatch.9): verify the
# bearer token's workspace claim + derive the scope from its workspace role.
gt-auth = { workspace = true }
# Domain dispatch handlers (hq-mcp-dispatch.1) implement an async trait.
async-trait = { workspace = true }
# Per-call tracing span (hq-mt-ops.2): the request-root span carries
# `workspace.id` so Tempo traces are searchable per tenant.
tracing = { workspace = true }
# Per-workspace request counter (hq-mt-deploy.8): bump gt_workspace_requests_total
# with the resolved tenant label on every dispatched call.
gt-telemetry = { workspace = true }
rmcp = { workspace = true, features = ["server", "transport-streamable-http-server"] }
axum = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
anyhow = { workspace = true }
# Durable Postgres audit sink (hq-core-host.6) — runtime query API (no compile-
# time macros), stores args as text so no sqlx `json` feature is needed.
sqlx = { workspace = true }

[dev-dependencies]
# Capturing subscriber for the `call_span` workspace.id assertion (hq-mt-ops.2).
tracing-subscriber = { workspace = true }
