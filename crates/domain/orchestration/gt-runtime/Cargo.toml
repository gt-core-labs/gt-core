[package]
name = "gt-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Per-workspace runtime composition: RootRegistry + RootHandle. Resolves a WorkspaceId to its composed application Root."

[dependencies]
# Kernel composition primitive (upward dep — orchestration -> kernel).
gt-module = { workspace = true }
# Observer-plugin relay (hq-mod-refactor.18): the per-ws event hub spawns
# `spawn_plugin_relay` over a `broadcast::Receiver<EventRecord>`; role observers
# (sheriff/witness/deacon/mayor/refinery) register here, not as central match arms.
gt-plugin = { workspace = true }
# `EventRecord` — the type-erased wire form the hub broadcasts to plugins + SSE.
gt-eventlog = { workspace = true }
# `Envelope`/`EventKind` — the typed actor events `drain_events_from` converts to `EventRecord`
# (hq-mod-refactor.24); `serde::Serialize` is the bound `EventRecord::from_envelope` needs.
gt-events = { workspace = true }
serde = { workspace = true }
# Tenant-boundary identifier (orchestration -> domain/platform, allowed by docs/03 dep table).
gt-workspace = { workspace = true }
# Lock-free concurrent map: the registry is hit on every per-workspace request.
dashmap = { workspace = true }
# Actor-stack lifecycle (hq-mt-routing.2): spawn tasks + broadcast the phase the
# supervisor watches. Orchestration tier may spawn (docs/03); kernel may not.
tokio = { workspace = true }

[dev-dependencies]
# Module version literals for the hot-reload rebuild test (hq-mod-flags.6).
semver = { workspace = true }
# Build an `EventRecord` payload + impl the `Plugin` trait in the event-hub tests
# (hq-mod-refactor.18).
serde_json = { workspace = true }
async-trait = { workspace = true }
