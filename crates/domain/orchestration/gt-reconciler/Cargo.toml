[package]
name = "gt-reconciler"
edition.workspace = true
version.workspace = true

# gt-reconciler (hq-core-mcp.4, option D) — an async, repo-aware audit job that
# the gt-mcp-server deliberately is NOT: it runs on a host/CI with checkouts of
# both repos (gt-core + the upstream app) and verifies, over the CLOSED beads, that each
# recorded commit_sha exists and each surface_json path is still present at HEAD.
# Inline close-time verification is impossible in the server container (no repo
# mount), so this catches fabricated shas + stale surfaces out of band instead.
[[bin]]
name = "gt-reconciler"
path = "src/main.rs"

[dependencies]
gt-store-dolt = { workspace = true }
gt-issues = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
