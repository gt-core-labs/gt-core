[package]
name = "gt-orchestration"
edition.workspace = true
version.workspace = true

[dependencies]
gt-events = { workspace = true }
# The kernel module seam — `ConvoyModule` declares the convoy domain's identity + capability
# + MCP tools so the `RootBuilder` harvests them (`hq-mod-refactor.6`); the aggregate logic
# is untouched.
gt-module = { workspace = true }
# `semver::Version` for the module's `ModuleMeta`.
semver = { workspace = true }
tokio.workspace = true
serde.workspace = true
# JSON Schema derives for Command arguments — surfaced by gt-mcp.
schemars.workspace = true
# Off-by-default `axum` REST adapter (hq-fe-api-orch.3): the orchestration sibling of the
# quota/merge HTTP surfaces — `register_routes` maps `convoy.*` to REST routes the builder
# mounts at `/api/v1/convoy` behind the auth+scope guard, with a utoipa OpenAPI spec. Folds
# into this crate behind the `axum` feature (docs/03 Rule 4), exactly as gt-quota/gt-merge gate
# their axum adapters — never a sibling crate. `gt-workspace` brings the `WorkspaceContext`
# extractor (the per-tenant event log is resolved from the auth context, never the path).
axum = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
gt-workspace = { workspace = true, optional = true, features = ["axum"] }

[features]
# Compile the axum REST adapter + OpenAPI spec (`http.rs`) and the route/spec overrides exposed
# via `ConvoyModule::with_http`. Off by default — the MCP-only build pulls no HTTP stack; the
# composition bin enables it to expose the REST surface.
axum = ["dep:axum", "dep:utoipa", "dep:async-trait", "dep:serde_json", "dep:gt-workspace"]

[dev-dependencies]
# The gate test plays the composition-root role (wires actor + records + replays).
# gt-eventlog is the log/replay machinery; ulid only seeds unique temp paths. The library
# itself depends ONLY on the kernel (gt-events) — never on another domain.
gt-eventlog = { workspace = true }
ulid.workspace = true
serde_json.workspace = true
# Exercise the REST router in-process (hq-fe-api-orch.3): `oneshot` a request and read the
# response without a live socket. Run with `--features axum` so the adapter + these helpers
# compile for the contract test.
axum = { workspace = true }
tower = { workspace = true, features = ["util"] }
async-trait = { workspace = true }
