[package]
name = "gt-agent"
edition.workspace = true
version.workspace = true

# Agent/session + polecat lifecycle substrate. Owned events + pure replay reducer
# + sync `Command` path; the supervisor drives transitions over `gt-bus`. No HTTP,
# no scope resolution. The `AgentModule` GtModule wrap (`hq-mod-refactor.7`, re-scoped
# from the abandoned CrewModule aggregate) declares this crate's contributions to the
# kernel module seam; roles-as-observers wiring is `hq-mod-refactor.16`.
[dependencies]
gt-events = { workspace = true }
gt-bus = { workspace = true }
# The kernel module seam the `AgentModule` wrap declares against (GtModule/Capability/
# McpRegistry/EventKind/Scope). `semver` supplies the `ModuleMeta` version.
gt-module = { workspace = true }
semver = { workspace = true }
# `fs` (heartbeat file) + `process` (polecat child supervision) on top of the workspace
# tokio feature set (macros/rt/sync/time); the supervisor is an explicit actor crate.
tokio = { workspace = true, features = ["fs", "process"] }
serde.workspace = true
# JSON Schema derives for Command arguments — surfaced by gt-mcp.
schemars.workspace = true
# Off-by-default `axum` REST adapter (hq-fe-api-orch.1): `register_routes` maps the `agent.*`
# session-lifecycle surface to REST routes the builder mounts at `/api/v1/agent` behind the
# auth+scope guard, with a utoipa OpenAPI spec. The adapter dispatches to the SAME event-log
# replay+append the `agent.*` MCP tools use (the pure `SessionRegistry::apply` reducer + the
# `AgentEvent` stream over `gt-eventlog`) — no domain logic is duplicated, only the wire shape
# differs. Folds into this crate behind the `axum` feature (docs/03 Rule 4), exactly as
# gt-issues/gt-documents gate theirs, never a sibling crate.
axum = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
# The event-log replay/append the REST dispatch runs (the durable backing for this
# event-sourced domain — there is no projection table). `gt-eventlog` is gastown's event-replay
# store ported up (hq-core-port.8); it is also a dev-dependency for the replay gate below.
gt-eventlog = { workspace = true, optional = true }

[features]
# Compile the axum REST adapter + OpenAPI spec (`http.rs`) and the route/spec overrides on
# `AgentModule`. Off by default — the MCP-only build pulls no HTTP stack; the composition bin
# enables it to expose the REST surface. Pulls the event-log replay/append the dispatch runs.
axum = ["dep:axum", "dep:utoipa", "dep:serde_json", "dep:gt-eventlog"]

[dev-dependencies]
# Replay gate only (the domain does not depend on the log at runtime). `gt-eventlog`
# is gastown's event-replay store ported up (hq-core-port.8; was `gt-audit`).
gt-eventlog = { workspace = true }
serde_json.workspace = true
# Throwaway event-log root for the REST contract test (`http_contract.rs`), the same way the
# MCP `AgentHandler` test seeds a tempdir log. Runs under `--features axum`.
tempfile.workspace = true
# Exercise the REST router in-process (`http_contract.rs`): `oneshot` a request and read the
# response without a live socket. Run with `--features axum` so the adapter + these helpers
# compile for the contract test.
axum = { workspace = true }
tower = { workspace = true, features = ["util"] }
