[package]
name = "gt-issues"
edition.workspace = true
version.workspace = true

# gt-issues — the issues tracker exposed as a `GtModule` (hq-core-host.2).
#
# Wraps the lifted Dolt issues store (`gt-store-dolt`, hq-core-host.1) behind the
# kernel module seam: `IssuesModule` contributes the `issues.*` MCP tools and the
# read resources, and the tool-arg structs + transport-free handlers ported from
# the upstream `gt-mcp` live here. No rmcp transport — that is the server bin (.3);
# this crate only contributes to the `McpRegistry`.
[dependencies]
gt-module = { workspace = true }
gt-module-mcp = { workspace = true }
gt-store-dolt = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
schemars = { workspace = true }
semver = { workspace = true }
# RFC3339 parsing for the stats lead-time roll-up (hq-web-extras.12), mirroring
# gt-feed's `time`-based timestamp parsing — parse-only, no clock.
time = { workspace = true, features = ["parsing"] }
# Off-by-default `axum` REST adapter (hq-auth-routes.2): the first GtModule HTTP
# surface — `register_routes` maps `issues.*` to REST routes the builder mounts at
# `/api/v1/issues` behind the auth+scope guard, with a utoipa OpenAPI spec. Folds
# into this crate behind the `axum` feature (docs/03 Rule 4), exactly as
# gt-workspace/gt-auth gate their axum adapters — never a sibling crate.
axum = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }
# Cross-workspace `/me/stats` (hq-web-extras.15): the handler reads the caller's
# verified `sub` from the `gt_auth::JwtClaims` the composition auth middleware
# injects, and the per-workspace stats source is an async port. Both ride the
# `axum` REST adapter, so they are optional + gated by that feature.
gt-auth = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }

[features]
# Compile the axum REST adapter + OpenAPI spec (`http.rs`) and the route/spec
# overrides on `IssuesModule`. Off by default — the MCP-only build pulls no HTTP
# stack; the composition bin enables it to expose the REST surface.
axum = ["dep:axum", "dep:utoipa", "dep:gt-auth", "dep:async-trait"]

[dev-dependencies]
gt-module-mcp = { workspace = true }
# Dolt-gated resources contract (hq-mcp-test.3): async runtime + a raw client to
# seed the throwaway test database the resource passthroughs read back.
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
mysql_async = { workspace = true }
# Exercise the REST router in-process (hq-auth-routes.2): `oneshot` a request and
# read the response without a live socket. Run with `--features axum` so the
# adapter + these helpers compile for the contract test.
axum = { workspace = true }
tower = { workspace = true, features = ["util"] }
