[package]
name = "gt-skills"
edition.workspace = true
version.workspace = true

# Skills + role-binding domain (`hq-fe-skills.1`). Same shape as gt-rig / gt-quota:
# owned events + pure replay reducer + sync `Command` path. No HTTP, no scope
# resolution. The `SkillsModule` wrap is `hq-mod-refactor.14`, not this port.
[dependencies]
gt-events = { workspace = true }
# gt-core module foundation (hq-mod-refactor.14): the `GtModule` trait the skills catalog is
# wrapped in (`module.rs`).
gt-module = { workspace = true }
# Closed-vocabulary scope validation (hq-role-scopes): `SetRoleScopes` rejects any scope outside
# `gt_rbac`'s vocabulary at write time, the same gate role CRUD runs. Kernel-tier, dependency-light.
gt-rbac = { workspace = true }
tokio.workspace = true
serde.workspace = true
schemars.workspace = true
# `semver::Version` for the module's `ModuleMeta`.
semver = { workspace = true }
# Off-by-default `axum` REST adapter (hq-web-extras.13): the read-only `skills.read` surface
# the FE consumes — `register_routes` maps `skills.*` reads to REST routes the builder mounts
# at `/api/v1/skills` behind the auth+scope guard, with a utoipa OpenAPI spec. Folds into this
# crate behind the `axum` feature (docs/03 Rule 4), exactly as gt-rig/gt-workspace gate theirs.
# `gt-workspace` brings the `WorkspaceContext` extractor (the per-tenant catalog is resolved
# from the auth context, never the path).
axum = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
gt-workspace = { workspace = true, optional = true, features = ["axum"] }

[features]
# Compile the axum REST adapter + OpenAPI spec (`http.rs`) and the route/spec overrides on
# `SkillsModule`. Off by default — the MCP-only build pulls no HTTP stack; the composition bin
# enables it to expose the REST surface.
axum = ["dep:axum", "dep:utoipa", "dep:async-trait", "dep:serde_json", "dep:gt-workspace"]

[dev-dependencies]
serde_json.workspace = true
# Exercise the REST router in-process (hq-web-extras.13): `oneshot` a request and read the
# response without a live socket. Run with `--features axum` so the adapter + these helpers
# compile for the contract test.
axum = { workspace = true }
tower = { workspace = true, features = ["util"] }
async-trait = { workspace = true }
