[package]
name = "gt-rig"
edition.workspace = true
version.workspace = true

# hq-mc72.12.29 — rig catalog as orchestrator state.
#
# A rig is a managed repository in the workspace (Go: `internal/rig`). This crate models the
# *orchestrator-state* facet only: the registry of rigs, their identity (name, beads prefix,
# git remotes, default branch) and a sync `Command` path that mutates that registry via
# domain events. Filesystem bootstrap (clone, bd init, redirects, dolt orphan cleanup,
# identity verify) is classified B1 and lives under `deploy/bootstrap` — this crate does NO
# I/O.
#
# Same shape as `gt-quota` / `gt-merge`: owned `RigEvent`, mutable `RigCatalog` inside one
# actor, pure replay reducer (`RigState`), inverted `RigRepository` port. Time enters as
# `now_secs` data so the reducer is byte-for-byte replayable.
[dependencies]
gt-events = { workspace = true }
# gt-core module foundation (hq-mod-refactor.1): the `GtModule` trait the rig catalog is
# wrapped in (`module.rs`). Path-available via the workspace dep declared in hq-mod-refactor.15.
gt-module = { workspace = true }
tokio.workspace = true
serde.workspace = true
# JSON Schema derives for Command arguments — surfaced by gt-mcp.
schemars.workspace = true
# `semver::Version` for the module's `ModuleMeta`.
semver = { workspace = true }
# Postgres `RigRepository` adapter (`PgRigs`, hq-mcp-dispatch.3). Off-by-default so
# the core build stays dependency-light; the heavy sqlx stack is pulled only when
# the PG-backed dispatch handler wires it (docs/03 — adapter lives beside the port).
sqlx = { workspace = true, optional = true }
# Off-by-default `axum` REST adapter (hq-fe-api-platform.2): the platform sibling of the
# issues HTTP surface — `register_routes` maps `rig.*` to REST routes the builder mounts at
# `/api/v1/rig` behind the auth+scope guard, with a utoipa OpenAPI spec. Folds into this crate
# behind the `axum` feature (docs/03 Rule 4), exactly as gt-issues/gt-workspace/gt-auth gate
# their axum adapters — never a sibling crate. `gt-workspace` brings the `WorkspaceContext`
# extractor (the per-tenant catalog is resolved from the auth context, never the path).
axum = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
gt-workspace = { workspace = true, optional = true, features = ["axum"] }

[features]
# Postgres adapter for the RigRepository port.
pg = ["dep:sqlx"]
# Compile the axum REST adapter + OpenAPI spec (`http.rs`) and the route/spec overrides on
# `RigsModule`. Off by default — the MCP-only build pulls no HTTP stack; the composition bin
# enables it to expose the REST surface.
axum = ["dep:axum", "dep:utoipa", "dep:async-trait", "dep:serde_json", "dep:gt-workspace"]

[dev-dependencies]
serde_json.workspace = true
# Exercise the REST router in-process (hq-fe-api-platform.2): `oneshot` a request and read the
# response without a live socket. Run with `--features axum` so the adapter + these helpers
# compile for the contract test.
axum = { workspace = true }
tower = { workspace = true, features = ["util"] }
async-trait = { workspace = true }
