[package]
name = "gt-documents"
edition.workspace = true
version.workspace = true

# hq-docs-api.1 (docs/11) — the document subsystem as a GtModule.
#
# Wraps the per-workspace document store (DocumentsRepository, hq-docs-store.3) + the blob
# store (gt-store-blob) + extraction (gt-docs-extract) behind the kernel module seam, so the
# composition root harvests the `documents.*` MCP tools instead of hand-listing them. This
# crate owns the tool-arg shapes + their shape-only `validate()`; the transport-free execute
# handlers (hq-docs-api.2) and the resource reads (hq-docs-api.3) build on top.
#
# Same faithful-wrap discipline as RigsModule / SkillsModule: the module facade is the unit
# struct the root registers; the live work happens in the injected repository/stores.
[dependencies]
gt-module = { workspace = true }
# `schema_for::<T>()` — JSON Schema for the tool-arg structs surfaced by MCP.
gt-module-mcp = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
semver = { workspace = true }

# hq-fe-api-platform.3 — the REST dispatch stack, all optional behind the `pg` feature. The
# handlers drive the same per-workspace store / blob store / extractor / embedder the MCP
# `DocumentsHandler` does (gt-composition/src/mcp/documents.rs), so no domain logic forks: only
# the wire shape differs. `base64` decodes attach payloads; `ulid` mints doc ids.
serde_json = { workspace = true, optional = true }
gt-store-pg = { workspace = true, optional = true }
gt-store-blob = { workspace = true, optional = true }
gt-docs-extract = { workspace = true, optional = true }
gt-docs-embed = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
ulid = { workspace = true, optional = true }
# 128-bit CSPRNG entropy for the unguessable share-link `hash` (hq-web-extras.9).
getrandom = { workspace = true, optional = true }
# `DateTime<Utc>` + `Duration` for share-link TTL arithmetic (hq-web-extras.9).
chrono = { workspace = true, optional = true }
# Off-by-default `axum` REST adapter (hq-fe-api-platform.3): `register_routes` maps `documents.*`
# to REST routes the builder mounts at `/api/v1/documents` behind the auth+scope guard, with a
# utoipa OpenAPI spec. Folds into this crate behind the `axum` feature (docs/03 Rule 4), exactly
# as gt-issues gates its adapter — never a sibling crate.
axum = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }

[features]
# The PG + blob + extraction + embedding store stack the REST handlers dispatch onto. Pulls the
# per-workspace `DocumentsRepository` (gt-store-pg `pg`), the object store, the text extractor,
# and the (optional) embedder, plus the base64/ulid/serde_json the dispatch needs.
pg = [
    "dep:serde_json",
    "dep:gt-store-pg",
    "gt-store-pg/pg",
    "dep:gt-store-blob",
    "dep:gt-docs-extract",
    "dep:gt-docs-embed",
    "dep:base64",
    "dep:ulid",
    "dep:getrandom",
    "dep:chrono",
]
# Compile the axum REST adapter + OpenAPI spec (`http.rs`) and the route/spec overrides on
# `DocumentsModule`. Off by default — the MCP-only build pulls no HTTP stack; the composition bin
# enables it to expose the REST surface. Implies `pg` (the handlers need the store).
axum = ["pg", "dep:axum", "dep:utoipa"]
# Passthrough to the fastembed-backed local Embedder (hq-docs-search.2 semantic search), exactly
# as gt-composition re-exports it.
embeddings-fastembed = ["pg", "gt-docs-embed/embeddings-fastembed"]

[dev-dependencies]
serde_json = { workspace = true }
# Exercise the REST router in-process (hq-fe-api-platform.3): `oneshot` a request and read the
# response without a live socket. Run with `--features axum` so the adapter + these helpers
# compile for the contract test; the live-PG roundtrip is skipped unless `GT_PG_URL` is set.
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
axum = { workspace = true }
tower = { workspace = true, features = ["util"] }
sqlx = { workspace = true }
