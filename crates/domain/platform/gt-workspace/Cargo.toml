[package]
name = "gt-workspace"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Workspace identity + catalog + repo port. Tenant-boundary primitive for multi-tenant apps."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
async-trait = { workspace = true }
# Heavy adapters live here behind off-by-default features so the core build
# stays dependency-light (see lib.rs "Adapters").
sqlx = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
# The kernel module seam + OpenAPI, pulled only by the `axum` feature: `WorkspaceModule`
# (the GtModule facade) and the `workspace.*` REST adapter (`hq-fe-api-platform.1`). The
# default dependency-light build (and the `pg`-only build) links neither.
gt-module = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }
# Module semver for `WorkspaceModule::meta`, pulled only with the `axum` module surface.
semver = { workspace = true, optional = true }
# Verified caller identity for the REST create path (hq-gap-workspace-rest-create-provision):
# `create_workspace` reads the creator's `sub` from the injected `JwtClaims` to attribute the
# tenant provisioning (membership), exactly as gt-issues' `/me/stats` does. Rides the `axum` adapter.
gt-auth = { workspace = true, optional = true }

[features]
# Postgres `WorkspaceRepository` adapter (`PgWorkspaces`).
pg = ["dep:sqlx"]
# Axum `WorkspaceContext` request extractor + the `WorkspaceModule` REST surface
# (`http.rs` / `module.rs`, `hq-fe-api-platform.1`) and its OpenAPI spec.
axum = ["dep:axum", "dep:gt-module", "dep:utoipa", "dep:semver", "dep:gt-auth"]

[dev-dependencies]
tokio = { workspace = true }
# Source of the workspaces migration SQL for the `pg` contract test.
gt-store-pg = { workspace = true }
# Exercise the REST router in-process (`hq-fe-api-platform.1`): `oneshot` a request and
# read the response without a live socket. Needs `--features axum` so the adapter compiles.
tower = { workspace = true, features = ["util"] }
