[package]
name = "gt-workspace"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Workspace identity + catalog + repo port. Tenant-boundary primitive for multi-tenant apps."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
async-trait = { workspace = true }
# Heavy adapters live here behind off-by-default features so the core build
# stays dependency-light (see lib.rs "Adapters").
sqlx = { workspace = true, optional = true }
axum = { workspace = true, optional = true }

[features]
# Postgres `WorkspaceRepository` adapter (`PgWorkspaces`).
pg = ["dep:sqlx"]
# Axum `WorkspaceContext` request extractor.
axum = ["dep:axum"]

[dev-dependencies]
tokio = { workspace = true }
# Source of the workspaces migration SQL for the `pg` contract test.
gt-store-pg = { workspace = true }
