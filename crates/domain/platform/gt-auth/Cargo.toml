[package]
name = "gt-auth"
edition.workspace = true
version.workspace = true

# hq-mod-refactor.17 — auth identity port for gt-core (first concrete carve-out of the
# hq-mod-refactor.13 bins decomposition).
#
# the upstream `bins/gt-web` carries the JWT/auth layer (auth.rs/jwt.rs/login.rs/scope.rs);
# gt-core's `gt-workspace::WorkspaceContext` extractor already resolves the tenant boundary
# from the `X-GT-Workspace` header but documents a deferred JWT fallback ("the JWT/auth layer
# is not yet ported to gt-core"). This crate is that missing primitive: the authentication
# Port — `JwtClaims` (carrying the REQUIRED `workspace` claim, hq-mt-auth.1) + the
# `Authenticator` trait + an in-memory test double — kept dependency-light.
#
# Hexagonal (docs/03): this is the Port + InMemory adapter. A real signature-verifying adapter
# (jsonwebtoken HS256/RS256) folds into THIS crate behind an off-by-default `jsonwebtoken`
# feature in a follow-up, exactly as gt-rig/gt-quota keep their `pg`/`axum` adapters gated —
# never a separate adapter crate (Rule 4). It does NOT depend on `gt-workspace` (platform →
# platform is forbidden): the `workspace` claim stays a `String` that the consumer parses into
# a `WorkspaceId`; the header-vs-JWT composition is wired one tier up (orchestration /
# composition root, hq-mod-refactor.13/.16).
[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
# Real email+password adapter (`password.rs`): argon2 PHC hashing. Off-by-default so the
# core build stays dependency-light — the crypto stack is pulled only when a binary mints or
# verifies passwords. Same gating as gt-rig/gt-quota's `pg` adapters (docs/03).
argon2 = { workspace = true, optional = true }
# Real RS256 signature-verifying adapter (`jwt.rs`): jsonwebtoken decode + verify. Off-by-default
# so the core build stays crypto-free — pulled only when a binary verifies tokens. Same gating
# as the `password-hash` adapter above (docs/03 Rule 4).
jsonwebtoken = { workspace = true, optional = true }
# JWKS publication for the RS256 verifier (`GET /auth/jwks`, hq-auth-routes.3): `jsonwebtoken`'s
# `DecodingKey` hides the raw `n`/`e`, so we parse the public PEM (`pem`) → DER (`simple_asn1`)
# and base64url-encode the modulus/exponent (`base64`). All three already compile inside
# `jsonwebtoken`'s own tree, so they add no new crate to the graph — only edges, gated with it.
pem = { workspace = true, optional = true }
simple_asn1 = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
# OS CSPRNG for the always-on refresh-token module (`refresh.rs`, hq-auth-mint.3): bearer
# credentials need unpredictable bytes, so this is a normal dep, not feature-gated.
getrandom = { workspace = true }
# Postgres `IdentityProvider` store (`pg.rs`, hq-auth-mint.2): the real login step — look a
# user up by email and verify the stored argon2 hash. Off-by-default so the core build stays
# sqlx-free; the heavy stack is pulled only when a binary wires the DB-backed login path. Same
# gating as gt-rig/gt-quota's `pg` adapters (docs/03 Rule 4 — adapter beside the port).
sqlx = { workspace = true, optional = true }
# SHA-256 for the durable refresh store (`refresh_pg.rs`, hq-auth-session.1): the opaque token
# is stored only as its hash, never in clear. Off-by-default, pulled in only with `pg`.
sha2 = { workspace = true, optional = true }
# Axum auth-endpoint router (`http.rs`, hq-auth-routes.1): POST /auth/login|refresh|logout,
# GET /auth/me. Off-by-default driving adapter (Rule 4) — the HTTP surface of the verify/mint/
# refresh/identity ports this crate owns; pulled only when a binary serves the endpoints.
axum = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
# Closed scope-vocabulary validation for the role-CRUD surface (`http.rs`, hq-rbac.4): a role's
# scopes are checked against `gt_rbac::validate_scope` before write, so a typo is a 400 rather
# than a silent permission hole. Kernel dep (platform → kernel is allowed), pulled only with the
# `axum` admin surface.
gt-rbac = { workspace = true, optional = true }
# OpenAPI annotations for the auth router (`http.rs`, hq-web-extras.10): `#[utoipa::path]` on the
# handlers + the `ApiDoc` the composition root fuses into `/openapi.json`, so the FE codegen reads
# /auth/* from the spec instead of hand-maintaining the types. Gated with the `axum` surface it
# describes — same as gt-issues (docs/03 Rule 4).
utoipa = { workspace = true, optional = true }
# HTTP client for the OAuth/OIDC login adapter (`oauth.rs`, hq-platform-hardening.3): the
# authorization-code handshake (token exchange + userinfo read) is network I/O. Off-by-default so
# the core build stays HTTP-client-free — pulled only when a binary serves the OAuth/OIDC login
# path. Same gating as the `pg`/`password-hash` adapters (docs/03 Rule 4 — adapter beside the port).
reqwest = { workspace = true, optional = true }
# AES-256-GCM seal/unseal of the OAuth client secret at rest (`crypto.rs`, hq-idp-db.1): the
# DB-backed provider store keeps each `client_secret` encrypted with the `GT_SECRET_KEY` master key
# and recovers the cleartext only in memory when building an `OidcConfig`. Off-by-default — pulled
# only with the `oauth` provider store, the same gating as `reqwest` above.
aes-gcm = { workspace = true, optional = true }
# hex decode of the `GT_SECRET_KEY` master key (`crypto.rs`, hq-idp-db.1) — base64 is already an
# optional dep above (shared with the `jsonwebtoken` JWKS adapter). Gated with `oauth`.
hex = { workspace = true, optional = true }
# Parse the versioned, embedded OAuth/IdP provider seed (`provider_seed.rs`,
# `seeds/oauth-providers.json`, hq-greenfield-seeds.3) at boot. Off-by-default — pulled only with the
# `oauth` provider store (the same gating as `aes-gcm`/`reqwest` above); the seed is a non-secret
# extract the composition root replays into an empty `oauth_providers` table.
serde_json = { workspace = true, optional = true }

[features]
# Production email+password provider — argon2 hash + verify.
password-hash = ["dep:argon2"]
# Production RS256 JWT verifier — jsonwebtoken decode + signature check (hq-auth-verify.1).
jsonwebtoken = ["dep:jsonwebtoken", "dep:pem", "dep:simple_asn1", "dep:base64"]
# Postgres-backed login store (`PgUsers`, hq-auth-mint.2). Pulls in `sqlx` and the
# `password-hash` adapter it reuses for argon2 verification — never duplicates that logic.
pg = ["dep:sqlx", "dep:sha2", "password-hash"]
# Axum auth-endpoint router (`http.rs`, hq-auth-routes.1). Needs the minter, so it implies
# `jsonwebtoken`; the login port is abstract, so the DB-backed adapter is opted in separately
# via `pg`.
axum = ["dep:axum", "dep:async-trait", "dep:gt-rbac", "dep:utoipa", "jsonwebtoken"]
# AES-GCM seal/unseal of secrets at rest (`crypto.rs`, hq-idp-db.1), carved out of `oauth` so a
# consumer that needs ONLY the secret crypto — e.g. the VCS-connection PAT store
# (hq-vcs-connections.1) — can reuse the EXACT helper without dragging in the OAuth HTTP client.
# Pulls the cipher (`aes-gcm`) + the `GT_SECRET_KEY` master-key decoders (`base64`/`hex`). The
# `oauth` feature implies this so the provider store still gets `crypto::{seal,unseal}`.
secret-crypto = ["dep:aes-gcm", "dep:base64", "dep:hex"]
# OAuth 2.0 / OpenID Connect login adapter (`oauth.rs`, hq-platform-hardening.3): the
# authorization-code handshake against a configured IdP. Implements the async `LoginProvider` port
# (defined with the `axum` HTTP surface), so it implies `axum`; pulls in `reqwest` as the HTTP
# client. Kept a separate opt-in so a non-OAuth deploy carries no HTTP client. The DB-backed
# provider store (hq-idp-db.1) folds in here too via `secret-crypto`: `aes-gcm` seals the client
# secret at rest, with `base64`/`hex` decoding the `GT_SECRET_KEY` master key. The Postgres adapter
# (`PgProviderRepo`) additionally needs `pg`, which a deploy opts into separately.
oauth = ["dep:reqwest", "dep:serde_json", "secret-crypto", "dep:sha2", "axum"]

[dev-dependencies]
serde_json = { workspace = true }
# Async harness for the `pg` adapter's GT_PG_URL-gated contract tests (`#[tokio::test]`). A
# dev-dependency only — never in the library's dependency closure, so `cargo build -p gt-auth`
# stays runtime-free. `net` is added for the `oauth` adapter's mock-IdP test, which binds a real
# loopback socket the `reqwest` handshake calls back into.
tokio = { workspace = true, features = ["net"] }
# `ServiceExt::oneshot` to drive the `axum` auth router in-process for the http.rs tests.
tower = { version = "0.5", features = ["util"] }
# The mock IdP (token + userinfo endpoints) the `oauth` adapter test handshakes against runs as a
# tiny in-process axum server. A dev-dependency only — the adapter itself depends on no server.
axum = { workspace = true }
