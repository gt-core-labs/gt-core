[package]
name = "gt-auth"
edition.workspace = true
version.workspace = true

# hq-mod-refactor.17 — auth identity port for gt-core (first concrete carve-out of the
# hq-mod-refactor.13 bins decomposition).
#
# gastown's `bins/gt-web` carries the JWT/auth layer (auth.rs/jwt.rs/login.rs/scope.rs);
# gt-core's `gt-workspace::WorkspaceContext` extractor already resolves the tenant boundary
# from the `X-GT-Workspace` header but documents a deferred JWT fallback ("the JWT/auth layer
# is not yet ported to gt-core"). This crate is that missing primitive: the authentication
# Port — `JwtClaims` (carrying the REQUIRED `workspace` claim, hq-mt-auth.1) + the
# `Authenticator` trait + an in-memory test double — kept dependency-light.
#
# Hexagonal (docs/03): this is the Port + InMemory adapter. A real signature-verifying adapter
# (jsonwebtoken HS256/RS256) folds into THIS crate behind an off-by-default `jsonwebtoken`
# feature in a follow-up, exactly as gt-rig/gt-quota keep their `pg`/`axum` adapters gated —
# never a separate adapter crate (Rule 4). It does NOT depend on `gt-workspace` (platform →
# platform is forbidden): the `workspace` claim stays a `String` that the consumer parses into
# a `WorkspaceId`; the header-vs-JWT composition is wired one tier up (orchestration /
# composition root, hq-mod-refactor.13/.16).
[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
# Real email+password adapter (`password.rs`): argon2 PHC hashing. Off-by-default so the
# core build stays dependency-light — the crypto stack is pulled only when a binary mints or
# verifies passwords. Same gating as gt-rig/gt-quota's `pg` adapters (docs/03).
argon2 = { workspace = true, optional = true }
# Real RS256 signature-verifying adapter (`jwt.rs`): jsonwebtoken decode + verify. Off-by-default
# so the core build stays crypto-free — pulled only when a binary verifies tokens. Same gating
# as the `password-hash` adapter above (docs/03 Rule 4).
jsonwebtoken = { workspace = true, optional = true }
# OS CSPRNG for the always-on refresh-token module (`refresh.rs`, hq-auth-mint.3): bearer
# credentials need unpredictable bytes, so this is a normal dep, not feature-gated.
getrandom = { workspace = true }
# Postgres `IdentityProvider` store (`pg.rs`, hq-auth-mint.2): the real login step — look a
# user up by email and verify the stored argon2 hash. Off-by-default so the core build stays
# sqlx-free; the heavy stack is pulled only when a binary wires the DB-backed login path. Same
# gating as gt-rig/gt-quota's `pg` adapters (docs/03 Rule 4 — adapter beside the port).
sqlx = { workspace = true, optional = true }

[features]
# Production email+password provider — argon2 hash + verify.
password-hash = ["dep:argon2"]
# Production RS256 JWT verifier — jsonwebtoken decode + signature check (hq-auth-verify.1).
jsonwebtoken = ["dep:jsonwebtoken"]
# Postgres-backed login store (`PgUsers`, hq-auth-mint.2). Pulls in `sqlx` and the
# `password-hash` adapter it reuses for argon2 verification — never duplicates that logic.
pg = ["dep:sqlx", "password-hash"]

[dev-dependencies]
serde_json = { workspace = true }
# Async harness for the `pg` adapter's GT_PG_URL-gated contract tests (`#[tokio::test]`). A
# dev-dependency only — never in the library's dependency closure, so `cargo build -p gt-auth`
# stays runtime-free.
tokio = { workspace = true }
