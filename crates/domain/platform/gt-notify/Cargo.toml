[package]
name = "gt-notify"
edition.workspace = true
version.workspace = true

# Ported up from the upstream app (hq-core-port.20; was hq-mysw). Notifier PORT: defines the port +
# the notification vocabulary + the signal→channel routing policy (which signals warrant mail
# vs feed-only). Adapters live at the edge (a `bins/` mail sender, the in-process fake for
# tests). This crate must NOT depend on any mail/transport crate — that is the point of the
# port. No reducer / event-log coupling, so replay-safe.
[dependencies]
gt-events = { workspace = true }
serde = { workspace = true }
