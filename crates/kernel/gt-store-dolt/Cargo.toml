[package]
name = "gt-store-dolt"
edition.workspace = true
version.workspace = true

# Dolt issues-store adapter, lifted from gastown (hq-core-host.1). Issues slice
# only — no gastown domain deps. Local AppError replaces gt-events.
[dependencies]
mysql_async = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Lock-free per-workspace pool registry (hq-mt-data.7).
dashmap = { workspace = true }
# Per-workspace flock guard against Dolt data-dir split-brain (hq-mt-data.12).
libc = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }
# Contract tests (hq-core-mcp.2) drive raw SQL setup (CREATE DATABASE/TABLE,
# seed) directly against a sandbox Dolt before exercising DoltIssues, and mint
# unique ids per run.
mysql_async = { workspace = true }
ulid = "1"
