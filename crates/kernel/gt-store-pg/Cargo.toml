[package]
name = "gt-store-pg"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gt-module = { workspace = true }
# Heavy Postgres pool wrapper lives behind the off-by-default `pg` feature so the
# migration-SQL host stays dependency-light (mirrors gt-workspace's adapters).
sqlx = { workspace = true, optional = true }
# `DocumentsRepository` port (hq-docs-store.3): the async trait seam + its typed
# errors. Pulled only with the `pg` adapter.
async-trait = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

[features]
# `WorkspacePool` + the `DocumentsRepository` PG adapter: per-workspace
# search_path-scoped Postgres access.
pg = ["dep:sqlx", "dep:async-trait", "dep:thiserror"]

[dev-dependencies]
# Drives the `pg`-gated WorkspacePool contract test (GT_PG_URL).
tokio = { workspace = true }
