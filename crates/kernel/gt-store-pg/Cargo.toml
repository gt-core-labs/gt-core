[package]
name = "gt-store-pg"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gt-module = { workspace = true }
# Heavy Postgres pool wrapper lives behind the off-by-default `pg` feature so the
# migration-SQL host stays dependency-light (mirrors gt-workspace's adapters).
sqlx = { workspace = true, optional = true }

[features]
# `WorkspacePool`: per-workspace search_path-scoped Postgres pool.
pg = ["dep:sqlx"]

[dev-dependencies]
# Drives the `pg`-gated WorkspacePool contract test (GT_PG_URL).
tokio = { workspace = true }
