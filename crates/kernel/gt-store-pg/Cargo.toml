[package]
name = "gt-store-pg"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gt-module = { workspace = true }
# Heavy Postgres pool wrapper lives behind the off-by-default `pg` feature so the
# migration-SQL host stays dependency-light (mirrors gt-workspace's adapters).
sqlx = { workspace = true, optional = true }
# `DocumentsRepository` port (hq-docs-store.3): the async trait seam + its typed
# errors. Pulled only with the `pg` adapter.
async-trait = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
# pgvector `Vector` type + its sqlx encode/decode, for the phase-2 semantic search
# column (hq-docs-search.2). Pure-Rust binding; the DB-side extension is installed by
# migration 0003.
pgvector = { workspace = true, optional = true }
# `gt-memory` domain types (`Memory`/`MemoryKind`) the `MemoryRepository` adapter maps
# rows to/from (hq-memory-mcp.2). Pure-std crate; gated under `pg` with the adapter so the
# migration-SQL host stays dependency-light.
gt-memory = { workspace = true, optional = true }
# `Embedder` trait the corpus importer (hq-memory-mcp.5) uses to (re)embed each memory. Only
# the decoupled trait is needed — no ML engine — so the default (non-fastembed) build is
# dependency-light. Gated under `pg` with the importer.
gt-docs-embed = { workspace = true, optional = true }

[features]
# `WorkspacePool` + the `DocumentsRepository` / `MemoryRepository` PG adapters + the corpus
# `.md` → memories importer: per-workspace search_path-scoped Postgres access.
pg = ["dep:sqlx", "dep:async-trait", "dep:thiserror", "dep:pgvector", "dep:gt-memory", "dep:gt-docs-embed"]

[dev-dependencies]
# Drives the `pg`-gated WorkspacePool contract test (GT_PG_URL).
tokio = { workspace = true }
# Duration arithmetic in the email-outbox contract test (hq-f24599).
chrono = { workspace = true }
